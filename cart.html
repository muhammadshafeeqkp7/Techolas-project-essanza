/* Product Card */
.perfume-card{
  background-color: var(--color-card);
  border-radius: 18px;
  overflow: hidden;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
  height: 100%;
  border: 1px solid rgba(201, 166, 107, 0.15);
  margin-top: 100PX;
}

.perfume-card:hover{
  transform: translateY(-6px);
  box-shadow: 0 18px 40px -10px rgba(201, 166, 107, 0.35);
}

.perfume-img-wrap{
background-color:whitesmoke;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.2rem 1rem;
  position: relative;
}

.perfume-img-wrap img{
  height: 200px;
  object-fit: contain;
  filter: drop-shadow(0 12px 18px rgba(91, 75, 73, 0.18));
  transition: transform 0.35s ease;
}

.perfume-card:hover .perfume-img-wrap img{
  transform: scale(1.05);
}

.badge-new{
  position: absolute;
  top: 14px;
  left: 14px;
  background-color: var(--color-gold);
  color: #fff;
  font-size: 0.68rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 0.3rem 0.7rem;
  border-radius: 50px;
}

.perfume-body{
  padding: 1.4rem 1.4rem 1.6rem;
}

.perfume-category{
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-gold);
  margin-bottom: 0.3rem;
}

.perfume-name{
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 0.3rem;
}

.perfume-notes{
  font-size: 0.85rem;
  color: var(--color-muted);
  margin-bottom: 1rem;
}

.scent-divider{
  height: 1px;
  width: 32px;
  background-color: var(--color-gold);
  margin-bottom: 1rem;
  transition: width 0.4s ease;
}

.perfume-card:hover .scent-divider{
  width: 100%;
}

.perfume-footer{
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.perfume-price{
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--color-text);
}

.btn-add{
  background-color: transparent;
  border: 1px solid var(--color-text);
  color: var(--color-text);
  font-size: 0.78rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 0.45rem 1.1rem;
  border-radius: 50px;
  transition: all 0.25s ease;
}

.btn-add:hover{
  background-color: var(--color-text);
  color: #fff;
}
